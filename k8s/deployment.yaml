# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-saludo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-saludo
  template:
    metadata:
      labels:
        app: app-saludo
    spec:
      # Configuración de seguridad a nivel de Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: saludo-container
        image: sriveraloaiza/saludo-ekumen:dcf7196ab8216edea69eb68c08cc3df4a13f9c89
        ports:
        - containerPort: 80
        # Configuración de seguridad a nivel de Contenedor
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: saludo-service
spec:
  selector:
    app: saludo
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP