name: CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Instalar Bazelisk (Bazel)
        run: |
          sudo curl -L https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64 -o /usr/local/bin/bazel
          sudo chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Compilar con Bazel
        run: |
          bazel build //saludo:app_saludo
          mkdir -p deploy_dist/saludo
          cp $(bazel info bazel-bin)/saludo/app_saludo ./deploy_dist/saludo/
          cp -RL $(bazel info bazel-bin)/saludo/app_saludo.runfiles ./deploy_dist/saludo/

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # MODIFICACIÓN: Construimos localmente (load: true) sin subir todavía
      - name: Construir imagen localmente
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.prod
          load: true # Carga la imagen en el demonio de Docker local de la Action
          tags: ${{ secrets.DOCKER_USERNAME }}/saludo-ekumen:${{ github.sha }}

      # NUEVO: Escaneo de Seguridad con Trivy
      - name: Escaneo de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/saludo-ekumen:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Detiene el pipeline si hay fallos críticos o altos
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      # MODIFICACIÓN: Si Trivy pasa, ahora sí subimos la imagen
      - name: Push de imagen verificada
        run: |
          docker push ${{ secrets.S_DOCKER_USERNAME }}/saludo-ekumen:${{ github.sha }}
          docker tag ${{ secrets.DOCKER_USERNAME }}/saludo-ekumen:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/saludo-ekumen:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/saludo-ekumen:latest

      - name: Actualizar manifiesto de K8s
        run: |
          IMAGE_TAG=${{ github.sha }}
          sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/saludo-ekumen:$IMAGE_TAG|g" k8s/deployment.yaml
          
      - name: Commit y Push del cambio en el YAML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore: update image tag to ${{ github.sha }} [skip ci]"
          git push